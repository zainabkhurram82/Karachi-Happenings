<!DOCTYPE html>
<html>
<head><title>Edit Event</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav><a href="/" class="logo">📍 Karachi Happening</a><div><a href="/">Back</a></div></nav>
<div class="form-box">
    <h2>Edit Event</h2>
    <form method="POST" action="/edit/{{ event.id }}">
        <input type="text" name="title" value="{{ event.title }}" required>
        <select name="category">
            <option value="Music" {% if event.category=='Music' %}selected{% endif %}>Music</option>
            <option value="Food" {% if event.category=='Food' %}selected{% endif %}>Food</option>
            <option value="Tech" {% if event.category=='Tech' %}selected{% endif %}>Tech</option>
            <option value="Art" {% if event.category=='Art' %}selected{% endif %}>Art</option>
            <option value="Sports" {% if event.category=='Sports' %}selected{% endif %}>Sports</option>
        </select>
        <input type="text" name="area" value="{{ event.area }}" required>
        <input type="date" name="date" value="{{ event.date }}" required>
        <input type="text" name="venue" value="{{ event.venue }}" required>
        <input type="text" name="price" value="{{ event.price }}" required>
        <textarea name="description" rows="3" required>{{ event.description }}</textarea>
        <button class="btn" type="submit">Save Changes</button>
    </form>
</div>
</body>
</html>
